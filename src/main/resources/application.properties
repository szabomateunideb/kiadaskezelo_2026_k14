spring.application.name=kiadaskezelo

server.port=9090

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2

spring.jpa.show-sql=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.ddl-auto=create-drop

# A DTO-k leképezése a service tranzakcióján belül történik.
spring.jpa.open-in-view=false

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Az id, jog és más, nem módosítható mező beküldése is 400-as hibát ad.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Üres adatbázis feltöltése kitalált órai adatokkal. Kikapcsolás: APP_DEMO_DATA_ENABLED=false
app.demo-data.enabled=true

app.time-zone=Europe/Budapest
app.recurring.enabled=true
app.recurring.delay-ms=60000
app.recurring.initial-delay-ms=30000
